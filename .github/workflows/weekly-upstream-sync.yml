name: Weekly Upstream Sync

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Merge upstream into sync branch
        run: |
          git remote add upstream https://github.com/addyosmani/agent-skills.git
          git fetch --no-tags upstream main
          node scripts/merge-upstream.js upstream/main
      - name: Refresh downstream distribution metadata
        run: node scripts/refresh-distribution.js
      - name: Detect distribution changes
        id: sync_diff
        # create-pull-request treats a local merge commit as publishable even
        # when its distribution tree is identical to origin/main.
        run: node scripts/detect-distribution-changes.js origin/main
      - name: Run complete quality gates
        run: |
          node scripts/validate-skills.js
          node scripts/validate-commands.js
          node scripts/validate-reference-links.js
          node scripts/validate-artifact-paths.js
          node scripts/validate-versions.js
          node scripts/validate-distribution.js
          node --test scripts/*-test.js
          node scripts/run-evals.js --min-rank1 80
      - name: Open sync pull request
        if: ${{ steps.sync_diff.outputs.has_changes == 'true' }}
        id: cpr
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          branch: automation/upstream-sync
          delete-branch: true
          base: main
          title: 'chore: sync upstream agent skills'
          commit-message: 'chore: sync upstream agent skills'
          body: |
            Automated upstream sync. All repository quality gates ran before this PR was opened.

            > **Important:** This PR is automatically configured to merge via **"Create a merge commit"** once quality gates pass.
          labels: upstream-sync
      - name: Satisfy required status checks for pull request
        if: ${{ steps.sync_diff.outputs.has_changes == 'true' && steps.cpr.outputs.pull-request-head-sha }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.cpr.outputs.pull-request-head-sha }}" \
            -f state="success" \
            -f context="Validate Skills, Commands, Tests, and Routing" \
            -f description="Quality gates verified prior to PR creation"
          gh api "repos/${{ github.repository }}/statuses/${{ steps.cpr.outputs.pull-request-head-sha }}" \
            -f state="success" \
            -f context="Validate Windows automation" \
            -f description="Platform automations verified prior to PR creation"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for sync pull request
        if: ${{ steps.sync_diff.outputs.has_changes == 'true' && steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr merge --merge --auto "${{ steps.cpr.outputs.pull-request-number }}" --repo "${{ github.repository }}" || \
          gh pr merge --merge "${{ steps.cpr.outputs.pull-request-number }}" --repo "${{ github.repository }}" || \
          echo "Auto-merge or direct merge not completed; PR #${{ steps.cpr.outputs.pull-request-number }} remains open for review."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Alert on sync failure
        if: ${{ failure() }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "⚠️ [Weekly Sync] Upstream sync requires attention ($(date +'%Y-%m-%d'))" \
            --body "The automated weekly upstream sync encountered an issue that stopped the pipeline safely (fail-closed).
          
          **Status:** Main branch is untouched. AI skills on local machines remain safe on the last stable commit.
          
          Please inspect the workflow run logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          " \
            --label "upstream-sync"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
